[project]
name = "translation-mcp-server"
version = "0.1.0"
description = "Translation MCP Server"
requires-python = ">=3.11"

[project.dependencies]
fastapi = "^0.95.0"
uvicorn = {extras = ["standard"], version = "^0.21.1"}
SQLAlchemy = {extras = ["asyncio"], version = "^2.0.20"}
asyncpg = "^0.27.0"
alembic = "^1.12.0"
pydantic = "^1.10.10"
python-dotenv = "^1.0.0"
pydantic-settings = "^1.0.0"
httpx = "^0.24.0"
openai = "^1.7.0"
pytest = "^7.4.0"
pytest-asyncio = "^0.22.0"
structlog = "^22.3.0"
mcp = "==1.27.0"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"