<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2B Profile Database Explorer</title>
<style>
  :root {
    --sidebar-bg: #1e293b;
    --sidebar-hover: #334155;
    --sidebar-active: #475569;
    --sidebar-text: #cbd5e1;
    --sidebar-heading: #94a3b8;
    --content-bg: #ffffff;
    --content-secondary: #f8fafc;
    --accent: #3b82f6;
    --accent-light: #dbeafe;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-secondary: #64748b;
    --pk-color: #f59e0b;
    --pk-bg: #fef3c7;
    --fk-color: #3b82f6;
    --fk-bg: #dbeafe;
    --jsonb-color: #8b5cf6;
    --jsonb-bg: #ede9fe;
    --kafka-green: #22c55e;
    --rest-blue: #3b82f6;
    --admin-purple: #8b5cf6;
    --sync-orange: #f97316;
    --internal-gray: #6b7280;
    --section-radius: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
    color: var(--text);
    background: var(--content-bg);
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid #0f172a;
  }

  .sidebar-header {
    padding: 20px 16px 12px;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
  }

  .sidebar-header h1 {
    font-size: 15px;
    font-weight: 700;
    color: #f1f5f9;
    letter-spacing: 0.5px;
  }

  .sidebar-header .subtitle {
    font-size: 11px;
    color: var(--sidebar-heading);
    margin-top: 2px;
  }

  .search-box {
    padding: 10px 12px;
    flex-shrink: 0;
  }

  .search-box input {
    width: 100%;
    padding: 7px 10px 7px 32px;
    border: 1px solid #475569;
    border-radius: 6px;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-box input::placeholder { color: #64748b; }
  .search-box input:focus { border-color: var(--accent); }

  .search-box {
    position: relative;
  }

  .search-icon {
    position: absolute;
    left: 22px;
    top: 50%;
    transform: translateY(-50%);
    color: #64748b;
    font-size: 13px;
    pointer-events: none;
  }

  .tree-container {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }

  .tree-container::-webkit-scrollbar { width: 6px; }
  .tree-container::-webkit-scrollbar-track { background: transparent; }
  .tree-container::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

  .domain-group { margin-bottom: 2px; }

  .domain-header {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--sidebar-heading);
    user-select: none;
    transition: color 0.15s;
  }

  .domain-header:hover { color: #e2e8f0; }

  .domain-header .chevron {
    margin-right: 6px;
    font-size: 10px;
    transition: transform 0.2s;
    display: inline-block;
    width: 12px;
  }

  .domain-header.collapsed .chevron { transform: rotate(-90deg); }

  .domain-items { overflow: hidden; }
  .domain-items.hidden { display: none; }

  .table-item {
    display: flex;
    align-items: center;
    padding: 6px 16px 6px 34px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.1s;
    color: var(--sidebar-text);
    border-left: 3px solid transparent;
  }

  .table-item:hover {
    background: var(--sidebar-hover);
    color: #f1f5f9;
  }

  .table-item.active {
    background: var(--sidebar-active);
    border-left-color: var(--accent);
    color: #ffffff;
    font-weight: 500;
  }

  .table-item .table-icon {
    margin-right: 8px;
    font-size: 11px;
    opacity: 0.6;
  }

  .table-item.hidden-by-search { display: none; }

  .table-count {
    margin-left: auto;
    font-size: 10px;
    background: #334155;
    padding: 1px 6px;
    border-radius: 8px;
    color: #94a3b8;
  }

  /* ── Main content ── */
  .main-content {
    flex: 1;
    overflow-y: auto;
    background: var(--content-secondary);
  }

  .main-content::-webkit-scrollbar { width: 8px; }
  .main-content::-webkit-scrollbar-track { background: var(--content-secondary); }
  .main-content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

  /* ── Welcome screen ── */
  .welcome-screen {
    padding: 40px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .welcome-header {
    text-align: center;
    margin-bottom: 40px;
  }

  .welcome-header h2 {
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }

  .welcome-header p {
    font-size: 15px;
    color: var(--text-secondary);
  }

  .er-svg-container {
    background: #fafaf8;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 24px 16px;
    margin-bottom: 32px;
    overflow-x: auto;
  }

  .er-svg-container h3 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text);
  }

  .er-legend {
    display: flex;
    gap: 24px;
    align-items: center;
    padding: 8px 16px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 12px;
    color: var(--text-secondary);
    flex-wrap: wrap;
  }

  .er-legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .er-legend-line-solid {
    width: 30px;
    height: 2px;
    background: #3b82f6;
  }

  .er-legend-line-dashed {
    width: 30px;
    height: 0;
    border-top: 2px dashed #d97706;
  }

  .er-legend-badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    color: white;
  }

  .er-legend-badge.one-n { background: #22c55e; }
  .er-legend-badge.one-one { background: #d97706; }
  .er-legend-badge.n-m { background: #ef4444; }

  .er-svg-wrap {
    width: 100%;
    min-width: 1060px;
  }

  .er-svg-wrap svg text { user-select: none; }

  .er-svg-wrap svg .er-box {
    cursor: pointer;
    transition: filter 0.15s;
  }

  .er-svg-wrap svg .er-box:hover {
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.15));
  }

  /* ── Flow SVG diagrams ── */
  .flow-svg-container {
    background: #f8fafb;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 28px;
    overflow-x: auto;
  }
  .flow-svg-container h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 16px;
    color: #1e293b;
  }
  .flow-svg-container svg text { user-select: none; }
  .flow-svg-container svg .flow-table-box {
    cursor: pointer;
    transition: filter 0.15s;
  }
  .flow-svg-container svg .flow-table-box:hover {
    filter: drop-shadow(0 2px 6px rgba(245,158,11,0.35));
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 32px;
  }

  .stat-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    text-align: center;
  }

  .stat-card .stat-number {
    font-size: 32px;
    font-weight: 700;
    color: var(--accent);
  }

  .stat-card .stat-label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  /* ── Detail view ── */
  .detail-view {
    display: none;
    padding: 32px 40px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .detail-view.active { display: block; }

  .detail-header {
    margin-bottom: 24px;
  }

  .detail-header .breadcrumb {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  .detail-header .breadcrumb span { cursor: pointer; }
  .detail-header .breadcrumb span:hover { color: var(--accent); }

  .detail-header h2 {
    font-size: 24px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .detail-header h2 .schema-prefix {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-secondary);
    background: var(--content-secondary);
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    gap: 4px;
  }

  .badge-kafka { background: #dcfce7; color: #166534; }
  .badge-rest { background: #dbeafe; color: #1e40af; }
  .badge-admin { background: #ede9fe; color: #5b21b6; }
  .badge-sync { background: #ffedd5; color: #9a3412; }
  .badge-internal { background: #f3f4f6; color: #374151; }

  .badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }

  .badge-kafka .badge-dot { background: var(--kafka-green); }
  .badge-rest .badge-dot { background: var(--rest-blue); }
  .badge-admin .badge-dot { background: var(--admin-purple); }
  .badge-sync .badge-dot { background: var(--sync-orange); }
  .badge-internal .badge-dot { background: var(--internal-gray); }

  /* Sections */
  .section {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--section-radius);
    margin-bottom: 16px;
    overflow: hidden;
  }

  .section-header {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    cursor: pointer;
    user-select: none;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    transition: background 0.1s;
    border-bottom: 1px solid transparent;
  }

  .section-header:hover { background: var(--content-secondary); }
  .section-header.open { border-bottom-color: var(--border); }

  .section-header .section-chevron {
    margin-right: 10px;
    font-size: 10px;
    transition: transform 0.2s;
    color: var(--text-secondary);
    display: inline-block;
  }

  .section-header.collapsed .section-chevron { transform: rotate(-90deg); }

  .section-header .section-count {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-secondary);
    background: var(--content-secondary);
    padding: 1px 8px;
    border-radius: 10px;
    font-weight: 400;
  }

  .section-body {
    padding: 16px 20px;
    overflow-x: auto;
  }

  .section-body.hidden { display: none; }

  /* Tables */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .data-table th {
    text-align: left;
    padding: 8px 12px;
    background: var(--content-secondary);
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 1;
  }

  .data-table td {
    padding: 8px 12px;
    border-bottom: 1px solid #f1f5f9;
    vertical-align: top;
  }

  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr:hover td { background: #f8fafc; }

  .col-pk { color: var(--pk-color); font-weight: 600; }
  .col-fk { color: var(--fk-color); font-weight: 500; cursor: pointer; }
  .col-fk:hover { text-decoration: underline; }
  .col-jsonb { color: var(--jsonb-color); font-weight: 500; }

  .col-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 3px;
    margin-left: 4px;
    vertical-align: middle;
  }

  .col-tag-pk { background: var(--pk-bg); color: var(--pk-color); }
  .col-tag-fk { background: var(--fk-bg); color: var(--fk-color); }
  .col-tag-jsonb { background: var(--jsonb-bg); color: var(--jsonb-color); }
  .col-tag-unique { background: #ecfdf5; color: #059669; }
  .col-tag-check { background: #fef3c7; color: #b45309; }

  .type-label {
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 12px;
    color: #64748b;
  }

  .nullable-yes { color: #94a3b8; }
  .nullable-no { color: #ef4444; font-weight: 500; }

  .default-val {
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 11px;
    color: #059669;
    background: #ecfdf5;
    padding: 1px 5px;
    border-radius: 3px;
  }

  /* Constraints */
  .constraint-list {
    list-style: none;
  }

  .constraint-list li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 6px 0;
    font-size: 13px;
    border-bottom: 1px solid #f1f5f9;
  }

  .constraint-list li:last-child { border-bottom: none; }

  .constraint-type {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
    min-width: 60px;
    text-align: center;
  }

  .constraint-pk { background: var(--pk-bg); color: var(--pk-color); }
  .constraint-unique { background: #ecfdf5; color: #059669; }
  .constraint-check { background: #fef3c7; color: #b45309; }
  .constraint-fk { background: var(--fk-bg); color: var(--fk-color); }
  .constraint-index { background: #f3f4f6; color: #4b5563; }

  /* Relationships */
  .rel-cards {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .rel-card {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    cursor: pointer;
    transition: all 0.15s;
    background: white;
    min-width: 200px;
  }

  .rel-card:hover {
    border-color: var(--accent);
    background: var(--accent-light);
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(59, 130, 246, 0.15);
  }

  .rel-card .rel-type {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-light);
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .rel-card .rel-info {
    flex: 1;
  }

  .rel-card .rel-table-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .rel-card .rel-via {
    font-size: 11px;
    color: var(--text-secondary);
  }

  .rel-card .rel-direction {
    font-size: 16px;
    color: var(--text-secondary);
  }

  /* Flow diagram */
  .flow-diagram {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0;
    padding: 12px 0;
  }

  .flow-step {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .flow-node {
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }

  .flow-node.source { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  .flow-node.transport { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  .flow-node.processor { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
  .flow-node.dao { background: #ede9fe; color: #5b21b6; border: 1px solid #ddd6fe; }
  .flow-node.table { background: #fce7f3; color: #9d174d; border: 1px solid #fbcfe8; }

  .flow-arrow {
    color: #94a3b8;
    font-size: 18px;
    margin: 0 4px;
    flex-shrink: 0;
  }

  /* JSONB viewer */
  .jsonb-viewer {
    background: #0f172a;
    color: #e2e8f0;
    padding: 16px;
    border-radius: 8px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 12px;
    line-height: 1.6;
    overflow-x: auto;
    margin-bottom: 12px;
  }

  .jsonb-viewer .json-key { color: #7dd3fc; }
  .jsonb-viewer .json-string { color: #86efac; }
  .jsonb-viewer .json-number { color: #fbbf24; }
  .jsonb-viewer .json-bool { color: #c084fc; }

  .jsonb-col-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--jsonb-color);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Sample data */
  .sample-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  }

  .sample-table th {
    background: var(--content-secondary);
    padding: 6px 10px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
  }

  .sample-table td {
    padding: 6px 10px;
    border-bottom: 1px solid #f1f5f9;
    max-width: 300px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .sample-table tr:hover td { background: #f8fafc; }

  /* Multi-tenancy note */
  .tenancy-note {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 6px;
    font-size: 12px;
    color: #1e40af;
    margin-top: 8px;
  }

  .tenancy-note .tenancy-icon { font-size: 14px; }

  .overview-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
  }

  .purpose-text {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  .note-box {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 10px 14px;
    background: #fefce8;
    border: 1px solid #fde68a;
    border-radius: 6px;
    font-size: 12px;
    color: #854d0e;
    margin-top: 8px;
  }

  /* ── Flow item in sidebar ── */
  .flow-item {
    display: flex;
    align-items: center;
    padding: 6px 16px 6px 34px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.1s;
    color: var(--sidebar-text);
    border-left: 3px solid transparent;
  }

  .flow-item:hover {
    background: var(--sidebar-hover);
    color: #f1f5f9;
  }

  .flow-item.active {
    background: var(--sidebar-active);
    border-left-color: #8b5cf6;
    color: #ffffff;
    font-weight: 500;
  }

  .flow-item .flow-icon {
    margin-right: 8px;
    font-size: 12px;
    opacity: 0.7;
  }

  .flow-item.coming-soon {
    opacity: 0.4;
    cursor: default;
    pointer-events: none;
  }

  .flow-item .coming-soon-tag {
    margin-left: auto;
    font-size: 9px;
    background: #475569;
    padding: 1px 5px;
    border-radius: 6px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  /* ── Flow view (main content) ── */
  .flow-view {
    display: none;
    padding: 32px 40px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .flow-view.active { display: block; }

  .flow-view .flow-header {
    margin-bottom: 28px;
  }

  .flow-view .flow-header .breadcrumb {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  .flow-view .flow-header .breadcrumb span { cursor: pointer; }
  .flow-view .flow-header .breadcrumb span:hover { color: var(--accent); }

  .flow-view .flow-header h2 {
    font-size: 24px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .flow-view .flow-header h2 .flow-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 12px;
    background: #ede9fe;
    color: #5b21b6;
  }

  .flow-layout {
    display: flex;
    gap: 24px;
  }

  .flow-timeline {
    flex: 1;
    min-width: 0;
  }

  .flow-tables-sidebar {
    width: 220px;
    flex-shrink: 0;
  }

  .flow-tables-panel {
    position: sticky;
    top: 32px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }

  .flow-tables-panel h4 {
    font-size: 12px;

// UTILITY FUNCTIONS

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function getSourceBadge(source) {
  const map = {
    'Kafka': {cls:'badge-kafka', label:'Kafka'},
    'REST API': {cls:'badge-rest', label:'REST API'},
    'Admin UI': {cls:'badge-admin', label:'Admin UI'},
    'Sync Service': {cls:'badge-sync', label:'Sync Service'},
    'Internal': {cls:'badge-internal', label:'Internal'}
  };
  const b = map[source] || map['Internal'];
  return `<span class="badge ${b.cls}"><span class="badge-dot"></span>${esc(b.label)}</span>`;
}

function syntaxHighlightJSON(obj, indent) {
  indent = indent || 0;
  const pad = '  '.repeat(indent);
  if (obj === null) return '<span class="json-bool">null</span>';
  if (typeof obj === 'boolean') return `<span class="json-bool">${obj}</span>`;
  if (typeof obj === 'number') return `<span class="json-number">${obj}</span>`;
  if (typeof obj === 'string') return `<span class="json-string">"${esc(obj)}"</span>`;
  if (Array.isArray(obj)) {
    if (obj.length === 0) return '[]';
    const items = obj.map(v => pad + '  ' + syntaxHighlightJSON(v, indent + 1));
    return '[\n' + items.join(',\n') + '\n' + pad + ']';
  }
  const keys = Object.keys(obj);
  if (keys.length === 0) return '{}';
  const entries = keys.map(k => pad + '  <span class="json-key">"' + esc(k) + '"</span>: ' + syntaxHighlightJSON(obj[k], indent + 1));
  return '{\n' + entries.join(',\n') + '\n' + pad + '}';
}

function getConstraintClass(type) {
  const map = { PK:'constraint-pk', FK:'constraint-fk', UNIQUE:'constraint-unique', CHECK:'constraint-check', INDEX:'constraint-index' };
  return map[type] || 'constraint-index';
}

function renderWelcome() {
  const totalCols = Object.values(TABLES).reduce((s, t) => s + t.columns.length, 0);
  const jsonbCount = Object.values(TABLES).reduce((s, t) => s + t.columns.filter(c => c.jsonb).length, 0);
  const fkCount = Object.values(TABLES).reduce((s, t) => s + t.columns.filter(c => c.fk).length, 0);

  // ── SVG ER Diagram builder ──
  const bw = 182, bh = 56, br = 8;
  const colX = [30, 270, 530, 790];
  const colHeaders = ['Core Entities', 'Mirror / Metadata', 'Content & i18n', 'Infrastructure'];

  // Row-Y helper: row 0 starts at y=80, each row is 88px apart
  const rowY = r => 80 + r * 88;

  // Table definitions: [fullName, displayName, subtitle, col, row, style, prominent]
  // prominent=true for customers and stores (thicker border)
  const erBoxes = [
    // Column 0 — Core
    ['pepsi_distributors',    'distributors',    'Regional sales entities',     0, 0, 'core',  false],
    ['pepsi_customers',       'customers',       'User accounts',               0, 1, 'core',  true],
    ['pepsi_stores',          'stores',          'Physical locations',           0, 3, 'core',  true],
    ['pepsi_store_segments',  'store_segments',  'N:M junction table',          0, 4, 'core',  false],
    // Column 1 — Mirror / Metadata
    ['pepsi_customer_master', 'customer_master', 'SAP mirror (Kafka)',          1, 0, 'mirror', false],
    ['pepsi_customer_config', 'customer_config', 'Preferences / consent',       1, 1, 'mirror', false],
    ['pepsi_web_metadata',    'web_metadata',    'WhatsApp IDs',                1, 2, 'mirror', false],
    ['pepsi_stores_master',   'stores_master',   'SAP mirror (Kafka)',          1, 3, 'mirror', false],
    // Column 2 — Content & i18n
    ['pepsi_languages',       'languages',       'Language codes',              2, 0, 'content', false],
    ['pepsi_translations',    'translations',    'UI label i18n',               2, 1, 'content', false],
    ['pepsi_legal_terms',     'legal_terms',     'T&C, privacy docs',          2, 2, 'content', false],
    ['pepsi_folder',          'folder',          'Segment org.',                2, 3, 'content', false],
    ['pepsi_segment',         'segment',         'Market segments',             2, 4, 'content', false],
    ['pepsi_segment_category','segment_category','Category defs',              2, 5, 'content', false],
    // Column 3 — Infrastructure
    ['pepsi_filemetadata',    'filemetadata',    'File uploads',                3, 0, 'infra', false],
    ['pepsi_pace_sync',       'pace_sync',       'Sync audit',                  3, 1, 'infra', false],
    ['shedlock',              'shedlock',        'Distributed locks',           3, 2, 'infra', false],
    ['sync_retries_job',      'sync_retries_job','Retry queue',                3, 3, 'infra', false],
  ];

  // Relationship lines: [fromTable, toTable, label, lineType, labelColor]
  // lineType: 'solid' = FK enforced (blue), 'dashed' = logical (orange)
  // labelColor: 'green' (1:N), 'amber' (1:1), 'red' (N:M)
  const erLines = [
    // FK-enforced (solid blue)
    ['pepsi_distributors','pepsi_customers',      '1:N','solid','green'],
    ['pepsi_customers','pepsi_stores',            '1:N','dashed','green'],
    ['pepsi_stores','pepsi_store_segments',       '1:N','solid','green'],
    ['pepsi_segment','pepsi_store_segments',      'N:M','solid','red'],
    ['pepsi_languages','pepsi_translations',      '1:N','solid','green'],
    ['pepsi_folder','pepsi_segment',              '1:N','solid','green'],
    // Logical / app-level (dashed orange)
    ['pepsi_customers','pepsi_customer_config',   '1:1','dashed','amber'],
    ['pepsi_customers','pepsi_web_metadata',      '1:N','dashed','amber'],
    ['pepsi_customers','pepsi_customer_master',   '1:1','dashed','amber'],
    ['pepsi_stores','pepsi_stores_master',        '1:1','dashed','amber'],
  ];

  // Helper: find box position info by table name
  function erBoxPos(tbl) {
    const b = erBoxes.find(e => e[0] === tbl);
    if (!b) return {cx:0,cy:0,x:0,y:0,right:0,bottom:0,col:0,row:0};
    const x = colX[b[3]], y = rowY(b[4]);
    return { x, y, cx: x + bw/2, cy: y + bh/2, right: x + bw, bottom: y + bh, col: b[3], row: b[4] };
  }

  // SVG height based on max rows
  const svgH = rowY(6) + 10;
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 ${svgH}" width="100%" height="${svgH}" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">`;

  // Defs: arrowheads and column header background filter
  svg += `<defs>
    <marker id="ah-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#3b82f6"/></marker>
    <marker id="ah-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#d97706"/></marker>
  </defs>`;

  // Light column background bands
  const bandColors = ['#eef4ff','#ecfdf5','#f8f8f8','#fff5f5'];
  colX.forEach((cx, i) => {
    svg += `<rect x="${cx - 10}" y="36" width="${bw + 20}" height="${svgH - 46}" rx="6" fill="${bandColors[i]}" opacity="0.5"/>`;
  });

  // Column header labels
  colHeaders.forEach((h, i) => {
    svg += `<text x="${colX[i] + bw/2}" y="54" text-anchor="middle" fill="#64748b" font-size="11" font-weight="700" letter-spacing="0.5">${h.toUpperCase()}</text>`;
  });

  // Draw relationship lines (behind boxes)
  erLines.forEach(([from, to, label, lineType, color]) => {
    const a = erBoxPos(from), b = erBoxPos(to);
    const strokeColor = lineType === 'solid' ? '#3b82f6' : '#d97706';
    const dash = lineType === 'solid' ? '' : ' stroke-dasharray="6,4"';
    const marker = lineType === 'solid' ? 'ah-blue' : 'ah-orange';
    const badgeBg = color === 'green' ? '#22c55e' : color === 'amber' ? '#d97706' : '#ef4444';

    // Determine if this is the reverse N:M line (segment -> store_segments)
    const isReverse = (from === 'pepsi_segment' && to === 'pepsi_store_segments');

    if (a.col === b.col) {
      // Same column — vertical line
      let x1, y1, x2, y2;
      if (a.row < b.row) {
        x1 = a.cx; y1 = a.bottom; x2 = b.cx; y2 = b.y;
      } else {
        x1 = a.cx; y1 = a.y; x2 = b.cx; y2 = b.bottom;
      }
      svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${strokeColor}" stroke-width="1.5"${dash} marker-end="url(#${marker})"/>`;
      const mx = (x1+x2)/2, my = (y1+y2)/2;
      svg += `<rect x="${mx-16}" y="${my-9}" width="32" height="18" rx="9" fill="${badgeBg}"/>`;
      svg += `<text x="${mx}" y="${my+4}" text-anchor="middle" fill="white" font-size="10" font-weight="600">${label}</text>`;
    } else if (isReverse) {
      // Special case: segment(col2,row4) -> store_segments(col0,row4) — arrow goes LEFT
      const x1 = a.x; const y1 = a.cy;
      const x2 = b.right; const y2 = b.cy;
      svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${strokeColor}" stroke-width="1.5"${dash} marker-end="url(#${marker})"/>`;
      const mx = (x1+x2)/2, my = y1;
      svg += `<rect x="${mx-16}" y="${my-9}" width="32" height="18" rx="9" fill="${badgeBg}"/>`;
      svg += `<text x="${mx}" y="${my+4}" text-anchor="middle" fill="white" font-size="10" font-weight="600">${label}</text>`;
    } else {
      // Cross-column — from right edge of source to left edge of target
      const x1 = a.right; const y1 = a.cy;
      const x2 = b.x;     const y2 = b.cy;

      if (Math.abs(y1 - y2) < 2) {
        // Straight horizontal
        svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${strokeColor}" stroke-width="1.5"${dash} marker-end="url(#${marker})"/>`;
        const mx = (x1+x2)/2, my = y1;
        svg += `<rect x="${mx-16}" y="${my-9}" width="32" height="18" rx="9" fill="${badgeBg}"/>`;
        svg += `<text x="${mx}" y="${my+4}" text-anchor="middle" fill="white" font-size="10" font-weight="600">${label}</text>`;
      } else {
        // L-shaped path
        const midX = x1 + (x2-x1)*0.5;
        svg += `<path d="M${x1},${y1} L${midX},${y1} L${midX},${y2} L${x2},${y2}" fill="none" stroke="${strokeColor}" stroke-width="1.5"${dash} marker-end="url(#${marker})"/>`;
        const mx = midX, my = (y1+y2)/2;
        svg += `<rect x="${mx-16}" y="${my-9}" width="32" height="18" rx="9" fill="${badgeBg}"/>`;
        svg += `<text x="${mx}" y="${my+4}" text-anchor="middle" fill="white" font-size="10" font-weight="600">${label}</text>`;
      }
    }
  });

  // Draw boxes on top
  erBoxes.forEach(([fullName, displayName, subtitle, col, row, style, prominent]) => {
    const x = colX[col], y = rowY(row);
    let fill, stroke, strokeW, textFill, subFill;

    switch (style) {
      case 'core':
        fill = '#eef4ff'; stroke = '#4f6fcf'; textFill = '#1e293b'; subFill = '#64748b'; break;
      case 'mirror':
        fill = '#ecfdf5'; stroke = '#34d399'; textFill = '#065f46'; subFill = '#6ee7b7'; break;
      case 'content':
        fill = '#f8f8f8'; stroke = '#a1a1aa'; textFill = '#1e293b'; subFill = '#71717a'; break;
      case 'infra':
        fill = '#fff5f5'; stroke = '#a1a1aa'; textFill = '#64748b'; subFill = '#94a3b8'; break;
      default:
        fill = '#ffffff'; stroke = '#e2e8f0'; textFill = '#1e293b'; subFill = '#64748b';
    }

    strokeW = prominent ? 2.5 : 1.5;

    svg += `<g class="er-box" onclick="selectTable('${fullName}')">`;
    svg += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="${br}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeW}"/>`;
    svg += `<text x="${x + bw/2}" y="${y + 23}" text-anchor="middle" fill="${textFill}" font-size="13" font-weight="${prominent ? 800 : 700}" font-family="'SF Mono',SFMono-Regular,Consolas,monospace">${displayName}</text>`;
    svg += `<text x="${x + bw/2}" y="${y + 40}" text-anchor="middle" fill="${subFill}" font-size="10">${subtitle}</text>`;
    svg += `</g>`;
  });

  svg += `</svg>`;

  return `
    <div class="welcome-screen" id="welcomeScreen">
      <div class="welcome-header">
        <h2>B2B Profile Database Schema</h2>
        <p>PepsiConnect Customer Domain &middot; Spring Boot CQRS &middot; PostgreSQL &middot; 18 Tables</p>
      </div>

      <div class="stats-row">
        <div class="stat-card"><div class="stat-number">18</div><div class="stat-label">Tables</div></div>
        <div class="stat-card"><div class="stat-number">${totalCols}</div><div class="stat-label">Columns</div></div>
        <div class="stat-card"><div class="stat-number">${jsonbCount}</div><div class="stat-label">JSONB Columns</div></div>
        <div class="stat-card"><div class="stat-number">${fkCount}</div><div class="stat-label">Foreign Keys</div></div>
      </div>

      <div class="er-svg-container">
        <h3>Entity Relationship Diagram</h3>
        <div class="er-legend">
          <div class="er-legend-item"><div class="er-legend-line-solid"></div> FK enforced</div>
          <div class="er-legend-item"><div class="er-legend-line-dashed"></div> Logical / app-level</div>
          <div class="er-legend-item"><span class="er-legend-badge one-n">1:N</span> One-to-Many</div>
          <div class="er-legend-item"><span class="er-legend-badge one-one">1:1</span> One-to-One</div>
          <div class="er-legend-item"><span class="er-legend-badge n-m">N:M</span> Many-to-Many</div>
        </div>
        <div class="er-svg-wrap">${svg}</div>
      </div>

      <div class="section" style="margin-bottom:0;">
        <div class="section-header open" style="cursor:default;">
          <span class="section-chevron">&#9660;</span>
          Multi-Tenancy Pattern
        </div>
        <div class="section-body">
          <div class="tenancy-note" style="margin-top:0;">
            <span class="tenancy-icon">&#127760;</span>
            <div>
              <strong>Schema prefix pattern:</strong> <code>{country}_{scope}_{tablename}</code><br/>
              Examples: <code>ind_pepsi_customers</code>, <code>mx_pepsi_stores</code>, <code>ca_pepsi_translations</code><br/>
              Country resolved from Bearer token via <code>ControllerUtils</code>. Schema resolved via <code>TableNameService</code>.
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderDetail(tableName) {
  const t = TABLES[tableName];
  if (!t) return '';

  const badges = t.sources.map(getSourceBadge).join(' ');

  // Overview section
  let overviewHtml = `
    <p class="purpose-text">${esc(t.purpose)}</p>
    <div class="overview-meta">${badges}</div>
    <div class="tenancy-note">
      <span class="tenancy-icon">&#127760;</span>
      <span>Schema: <code>${esc(t.tenancy)}</code></span>
    </div>
  `;
  if (t.note) {
    overviewHtml += `<div class="note-box">&#9888; ${esc(t.note)}</div>`;
  }

  // Columns section
  let colRows = '';
  t.columns.forEach(c => {
    let nameClass = '';
    let tags = '';
    if (c.pk) { nameClass = 'col-pk'; tags += '<span class="col-tag col-tag-pk">PK</span>'; }
    if (c.fk) { nameClass = 'col-fk'; tags += `<span class="col-tag col-tag-fk">FK</span>`; }
    if (c.jsonb) { nameClass = nameClass || 'col-jsonb'; tags += '<span class="col-tag col-tag-jsonb">JSONB</span>'; }
    if (c.unique) { tags += '<span class="col-tag col-tag-unique">UQ</span>'; }
    if (c.check) { tags += `<span class="col-tag col-tag-check">CHK</span>`; }

    const nameHtml = c.fk
      ? `<span class="${nameClass}" onclick="selectTable('${c.fk}')" title="Navigate to ${c.fk}">${esc(c.name)}</span>${tags}`
      : `<span class="${nameClass}">${esc(c.name)}</span>${tags}`;

    const nullHtml = c.nullable
      ? '<span class="nullable-yes">YES</span>'
      : '<span class="nullable-no">NOT NULL</span>';

    const defHtml = c.default ? `<span class="default-val">${esc(c.default)}</span>` : '<span style="color:#cbd5e1;">-</span>';

    let notesHtml = esc(c.notes || '');
    if (c.check) notesHtml += (notesHtml ? '<br/>' : '') + '<span style="font-size:11px;color:#b45309;">' + esc(c.check) + '</span>';
    if (c.fk) notesHtml += (notesHtml ? '<br/>' : '') + '<span style="font-size:11px;color:var(--fk-color);">References ' + esc(c.fk) + '</span>';

    colRows += `<tr>
      <td>${nameHtml}</td>
      <td><span class="type-label">${esc(c.type)}</span></td>
      <td>${nullHtml}</td>
      <td>${defHtml}</td>
      <td>${notesHtml}</td>
    </tr>`;
  });

  const columnsHtml = `
    <table class="data-table">
      <thead><tr><th>Name</th><th>Type</th><th>Nullable</th><th>Default</th><th>Notes</th></tr></thead>
      <tbody>${colRows}</tbody>
    </table>
  `;

  // Constraints & Indexes
  let constraintHtml = '<ul class="constraint-list">';
  t.constraints.forEach(c => {
    constraintHtml += `<li><span class="constraint-type ${getConstraintClass(c.type)}">${esc(c.type)}</span><span>${esc(c.desc)}</span></li>`;
  });
  t.indexes.forEach(idx => {
    constraintHtml += `<li><span class="constraint-type constraint-index">INDEX</span><span>${esc(idx.desc)}</span></li>`;
  });
  if (t.constraints.length === 0 && t.indexes.length === 0) {
    constraintHtml += '<li style="color:var(--text-secondary);font-style:italic;">No additional constraints or indexes defined.</li>';
  }
  constraintHtml += '</ul>';

  // Relationships
  let relHtml = '';
  if (t.relationships.length > 0) {
    relHtml = '<div class="rel-cards">';
    t.relationships.forEach(r => {
      const arrow = r.direction === 'out' ? '&#8594;' : '&#8592;';
      relHtml += `
        <div class="rel-card" onclick="selectTable('${r.table}')">
          <span class="rel-type">${esc(r.type)}</span>
          <div class="rel-info">
            <div class="rel-table-name">${esc(r.table)}</div>
            <div class="rel-via">via ${esc(r.via)}</div>
          </div>
          <span class="rel-direction">${arrow}</span>
        </div>
      `;
    });
    relHtml += '</div>';
  } else {
    relHtml = '<p style="color:var(--text-secondary);font-style:italic;">No direct relationships.</p>';
  }

  // Data flow
  let flowHtml = '<div class="flow-diagram">';
  t.flow.forEach((step, i) => {
    if (i > 0) flowHtml += '<span class="flow-arrow">&#8594;</span>';
    flowHtml += `<span class="flow-node ${step.type}">${esc(step.label)}</span>`;
  });
  flowHtml += '</div>';

  // JSONB structure
  const jsonbKeys = Object.keys(t.jsonbExamples || {});
  let jsonbHtml = '';
  if (jsonbKeys.length > 0) {
    jsonbKeys.forEach(key => {
      jsonbHtml += `<div class="jsonb-col-label">&#9670; ${esc(key)}</div>`;
      jsonbHtml += `<div class="jsonb-viewer">${syntaxHighlightJSON(t.jsonbExamples[key])}</div>`;
    });
  }

  // Sample data
  let sampleHtml = '<table class="sample-table"><thead><tr>';
  t.sampleData.headers.forEach(h => { sampleHtml += `<th>${esc(h)}</th>`; });
  sampleHtml += '</tr></thead><tbody>';
  t.sampleData.rows.forEach(row => {
    sampleHtml += '<tr>';
    row.forEach(cell => { sampleHtml += `<td title="${esc(cell)}">${esc(cell)}</td>`; });
    sampleHtml += '</tr>';
  });
  sampleHtml += '</tbody></table>';

  // Assemble sections
  const sections = [
    {id:'overview', title:'Overview', content: overviewHtml, open:true},
    {id:'columns', title:'Columns', count: t.columns.length, content: columnsHtml, open:true},
    {id:'constraints', title:'Constraints & Indexes', count: t.constraints.length + t.indexes.length, content: constraintHtml, open:true},
    {id:'relationships', title:'Relationships', count: t.relationships.length, content: relHtml, open:true},
    {id:'flow', title:'Data Source Flow', content: flowHtml, open:true},
  ];

  if (jsonbKeys.length > 0) {
    sections.push({id:'jsonb', title:'JSONB Structure', count: jsonbKeys.length, content: jsonbHtml, open:false});
  }

  sections.push({id:'sample', title:'Sample Data', count: t.sampleData.rows.length + ' rows', content: sampleHtml, open:false});

  let sectionsHtml = '';
  sections.forEach(s => {
    const countBadge = s.count !== undefined ? `<span class="section-count">${s.count}</span>` : '';
    const openCls = s.open ? 'open' : 'collapsed';
    const hiddenCls = s.open ? '' : 'hidden';
    sectionsHtml += `
      <div class="section">
        <div class="section-header ${openCls}" onclick="toggleSection(this)">
          <span class="section-chevron">&#9660;</span>
          ${esc(s.title)}
          ${countBadge}
        </div>
        <div class="section-body ${hiddenCls}">${s.content}</div>
      </div>
    `;
  });

  return `
    <div class="detail-view active" id="detailView">
      <div class="detail-header">
        <div class="breadcrumb">
          <span onclick="showWelcome()">Schema</span> &rsaquo; ${esc(tableName)}
        </div>
        <h2>
          ${esc(tableName)}
          <span class="schema-prefix">${esc(t.tenancy)}</span>
        </h2>
      </div>
      ${sectionsHtml}
    </div>
  `;
}

let currentTable = null;
let currentFlow = null;

function selectTable(tableName) {
  if (!TABLES[tableName]) return;
  currentTable = tableName;
  currentFlow = null;

  // Update sidebar active state
  document.querySelectorAll('.table-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.flow-item').forEach(el => el.classList.remove('active'));
  const activeItem = document.querySelector(`.table-item[data-table="${tableName}"]`);
  if (activeItem) {
    activeItem.classList.add('active');
    // Ensure parent domain is expanded
    const domainItems = activeItem.closest('.domain-items');
    if (domainItems && domainItems.classList.contains('hidden')) {
      domainItems.classList.remove('hidden');
      domainItems.previousElementSibling.classList.remove('collapsed');
    }
  }

  // Render detail
  document.getElementById('mainContent').innerHTML = renderDetail(tableName);
  document.getElementById('mainContent').scrollTop = 0;
}

function showWelcome() {
  currentTable = null;
  currentFlow = null;
  document.querySelectorAll('.table-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.flow-item').forEach(el => el.classList.remove('active'));
  document.getElementById('mainContent').innerHTML = renderWelcome();
}

function toggleSection(header) {
  header.classList.toggle('collapsed');
  header.classList.toggle('open');
  const body = header.nextElementSibling;
  body.classList.toggle('hidden');
}

// Search
document.getElementById('searchInput').addEventListener('input', function(e) {
  const query = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.table-item').forEach(el => {
    const name = el.dataset.table;
    if (!query || name.includes(query)) {
      el.classList.remove('hidden-by-search');
    } else {
      el.classList.add('hidden-by-search');
    }
  });

  // Show/hide domain groups based on visible children
  document.querySelectorAll('.domain-group').forEach(group => {
    const visibleTableItems = group.querySelectorAll('.table-item:not(.hidden-by-search)');
    const flowItems = group.querySelectorAll('.flow-item');
    // Flows group: always visible when no query, hidden when query doesn't match
    const hasVisibleContent = visibleTableItems.length > 0 || (flowItems.length > 0 && !query);
    group.style.display = hasVisibleContent ? '' : 'none';
    // Expand groups when searching
    if (query) {
      const items = group.querySelector('.domain-items');
      const header = group.querySelector('.domain-header');
      if (items) items.classList.remove('hidden');
      if (header) header.classList.remove('collapsed');
    }
  });
});

function showFlow(flowId) {
  currentTable = null;
  currentFlow = flowId;

  // Clear sidebar active states
  document.querySelectorAll('.table-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.flow-item').forEach(el => el.classList.remove('active'));
  const activeFlow = document.querySelector(`.flow-item[data-flow="${flowId}"]`);
  if (activeFlow) activeFlow.classList.add('active');

  const renderers = {
    'content-consent': renderContentConsentFlow,
    'store-ingestion': renderStoreIngestionFlow,
    'translations': renderTranslationsFlow,
    'segments': renderSegmentsFlow,
    'whatsapp-metadata': renderWhatsappMetadataFlow
  };

  const renderer = renderers[flowId];
  if (renderer) {
    document.getElementById('mainContent').innerHTML = renderer();
    document.getElementById('mainContent').scrollTop = 0;
  }
}
