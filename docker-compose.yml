version: "3.8"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: translations
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      - DB_URL=postgresql+asyncpg://postgres:postgres@db:5432/translations
      - APP_ENV=local
      - AUTO_CREATE_DB=false
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  mcp:
    build: .
    command: ["python", "src/mcp/server.py"]
    environment:
      - DB_URL=postgresql+asyncpg://postgres:postgres@db:5432/translations
      - APP_ENV=local
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
