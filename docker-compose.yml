version: "3.8"

services:
  translation-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: translations
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      translation-db:
        condition: service_healthy

  mcp:
    build: .
    command: ["python", "-m", "src.mcp.server"]
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    ports:
      - "8001:8001"
    depends_on:
      translation-db:
        condition: service_healthy

volumes:
  db_data:
